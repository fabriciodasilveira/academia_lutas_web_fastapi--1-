<div class="d-flex align-items-center mb-4">
    <h3 class="mb-0 fw-bold">Mais Opções</h3>
</div>

<div class="list-group shadow-sm border-0 rounded-3">
    <a href="#/events" class="list-group-item list-group-item-action d-flex align-items-center p-3 border-0 border-bottom">
        <div class="bg-warning bg-opacity-10 rounded-circle p-2 text-warning me-3" style="width: 45px; height: 45px; display: grid; place-items: center;">
            <i class="fas fa-calendar-alt fa-lg"></i>
        </div>
        <div class="flex-grow-1">
            <h6 class="mb-0 fw-bold text-dark">Eventos e Seminários</h6>
            <small class="text-muted">Inscrições e calendário</small>
        </div>
        <i class="fas fa-chevron-right text-muted"></i>
    </a>

    <a href="#/beneficios" class="list-group-item list-group-item-action d-flex align-items-center p-3 border-0 border-bottom">
        <div class="bg-success bg-opacity-10 rounded-circle p-2 text-success me-3" style="width: 45px; height: 45px; display: grid; place-items: center;">
            <i class="fas fa-handshake fa-lg"></i>
        </div>
        <div class="flex-grow-1">
            <h6 class="mb-0 fw-bold text-dark">Clube de Vantagens</h6>
            <small class="text-muted">Descontos em parceiros</small>
        </div>
        <i class="fas fa-chevron-right text-muted"></i>
    </a>

    <button id="btn-logout-outros" class="list-group-item list-group-item-action d-flex align-items-center p-3 border-0 bg-light text-danger mt-3 rounded">
        <div class="me-3" style="width: 45px; text-align: center;">
            <i class="fas fa-sign-out-alt fa-lg"></i>
        </div>
        <div class="flex-grow-1">
            <h6 class="mb-0 fw-bold">Sair do App</h6>
        </div>
    </button>
</div>

<script>
    document.getElementById('btn-logout-outros').onclick = () => {
        if(confirm('Deseja realmente sair?')) {
            localStorage.clear();
            window.location.hash = '/login';
        }
    };
</script>
